baseURL = "https://intelkavkaz.ru/"
languageCode = "ru-ru"
title = "Интеллектуальный Кавказ"
theme = "intelkavkaz"
enableRobotsTXT = true
defaultContentLanguage = "ru"
hasCJKLanguage = false
summaryLength = 70
# disableKinds = ["taxonomyTerm"]
canonifyURLs = true
pluralizeListTitles = false

buildDrafts = false
buildFuture = false
buildExpired = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "monokai"

[pagination]
  pagerSize = 10

##############################################
# Site parameters
##############################################
[params]
  siteName = "Интеллектуальный Кавказ"
  siteDescription = "Региональное отделение Всероссийской ассоциации общественных объединений «Интеллектуальная Россия» в Чеченской Республике"
  author = "Муса Дунаев"
  copyright = "© 2026 Интеллектуальный Кавказ"
  defaultImage = "/images/og-default.jpg"
  dateFormat = "02 Jan 2006"

  email = "info@intelkavkaz.ru"
  phone = "8 (928) 022-21-40"
  address = "г. Грозный, Чеченская Республика"

  [[params.social]]
    name = "VK"
    icon = "vk"
    url = "https://vk.com/id196339167"

  [params.theme]
    layout = "default"
    colorScheme = "light"
    logo = "/images/logo.png"
    favicon = "/favicon.ico"

  [params.sections]
    showHero = true
    showFeatures = true
    showBlog = true
    showTestimonials = false
    showCTA = true

  [params.newsletter]
    enable = false

##############################################
# Taxonomies
##############################################
[taxonomies]
  category = "categories"
  tag = "tags"
  project  = "projects"
  location = "locations"

##############################################
# Menus
##############################################
[menu]

  [[menu.main]]
    name = "Главная"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "О нас"
    url = "/about/"
    weight = 2

  [[menu.main]]
    name = "Новости"
    url = "/news/"
    weight = 3

  [[menu.main]]
    name = "Мероприятия"
    url = "/events/"
    weight = 4

  [[menu.main]]
    name = "Блог"
    url = "/blog/"
    weight = 5

  [[menu.main]]
    name = "Контакты"
    url = "/contact/"
    weight = 6

  [[menu.footer]]
    name = "FAQ"
    url = "/faq/"
    weight = 1

  [[menu.footer]]
    name = "Политика конфиденциальности"
    url = "/privacy/"
    weight = 2

  [[menu.footer]]
    name = "Условия использования"
    url = "/terms/"
    weight = 3

##############################################
# Outputs
##############################################
[outputs]
  home = ["HTML", "RSS"]

##############################################
# Sitemap
##############################################
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    respectDoNotTrack = true

  [privacy.youtube]
    privacyEnhanced = true

##############################################
# Deployment (GitHub Pages)
##############################################
[deployment]
  [[deployment.targets]]
    name = "production"
    URL = "https://intelkavkaz.ru/"

##############################################
# Services
##############################################
[services]
  [services.googleAnalytics]
    id = "G-XXXXXXXXXX"

##############################################
# Languages
##############################################
[languages]
  [languages.ru]
    languageName = "Русский"
    weight = 1
    title = "Интеллектуальный Кавказ"

  [languages.en]
    languageName = "English"
    weight = 2
    title = "Intellectual Caucasus"

##############################################
# Minify
##############################################
[minify]
  disableXML = true
  tdewolff = { html = { keepWhitespace = false } }

[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = -1

[permalinks]
  news = "/news/:year/:month/:slug/"

[urlizeoptions]
  # Removes trailing dots and special characters from generated URLs/paths